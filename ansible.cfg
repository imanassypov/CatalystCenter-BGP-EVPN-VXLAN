# Repo-root config so tools that invoke ansible from the workspace root (the
# VS Code Ansible extension's --syntax-check) resolve the vault and inventory.
# The authoritative config for CLI runs is CICD Pipeline/ansible/ansible.cfg.
[inventory]
enable_plugins = cisco.cml.cml_inventory, host_list, script, auto, yaml, ini, toml

[defaults]
inventory = CICD Pipeline/ansible/inventory/
roles_path = CICD Pipeline/ansible/roles
host_key_checking = False
deprecation_warnings = False
vault_password_file = CICD Pipeline/.vault_pass
interpreter_python = auto_silent

[privilege_escalation]
become = False
