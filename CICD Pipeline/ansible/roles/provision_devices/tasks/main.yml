---
# =============================================================================
# provision_devices / main.yml  —  Pipeline stage 9.0
# =============================================================================
# Provisions fabric devices to sites via SDA provisionDevices API.
# Groups management IPs by site path, resolves site + device UUIDs, skips
# already-provisioned devices unless force_reprovision=true.
#
# Prerequisites (playbook pre_tasks):
#   catc_common.auth_token    → _catc_token
#   catc_common.load_settings → settings_data
#
# Per-site logic: tasks/provision_site.yml
# =============================================================================

# ── Step 3: Build per-site device map ─────────────────────────────────────
#
# Iterate every project entry that has a non-empty device_list.
# The site hierarchy path is reconstructed from the split
# HierarchyParent/Area/Bldg/Floor fields, matching the pattern used
# across all other playbooks in this lab series.
#
# Example - the single project entry currently in settings.json
#   In : settings_data.project = [
#          {
#            "HierarchyParent": "Global/PODS",
#            "HierarchyArea":   "POD 0",
#            "HierarchyBldg":   "Building P0",
#            "HierarchyFloor":  "Floor 1",
#            "device_list":     "198.19.1.1,198.19.1.2,198.19.1.3,198.19.1.4,198.19.1.5,198.19.1.6"
#          }
#        ]
#   Out: _site_device_map = {
#          "Global/PODS/POD 0/Building P0/Floor 1": [
#            "198.19.1.1", "198.19.1.2", "198.19.1.3",
#            "198.19.1.4", "198.19.1.5", "198.19.1.6"
#          ]
#        }
#
# Example - two projects sharing a site, and one with no floor
#   In : settings_data.project = [
#          {
#            "HierarchyParent": "Global/PODS",
#            "HierarchyArea":   "POD 0",
#            "HierarchyBldg":   "Building P0",
#            "HierarchyFloor":  "Floor 1",
#            "device_list":     "198.19.1.1,198.19.1.2"
#          },
#          {
#            "HierarchyParent": "Global/PODS",
#            "HierarchyArea":   "POD 0",
#            "HierarchyBldg":   "Building P0",
#            "HierarchyFloor":  "Floor 1",
#            "device_list":     "198.19.1.3,198.19.1.4"
#          },
#          {
#            "HierarchyParent": "Global/PODS",
#            "HierarchyArea":   "POD 1",
#            "HierarchyBldg":   "Building P1",
#            "HierarchyFloor":  "",
#            "device_list":     "198.19.2.1"
#          }
#        ]
#   Out: _site_device_map = {
#          "Global/PODS/POD 0/Building P0/Floor 1": [
#            "198.19.1.1", "198.19.1.2", "198.19.1.3", "198.19.1.4"
#          ],
#          "Global/PODS/POD 1/Building P1": ["198.19.2.1"]
#        }
# device_list is a comma-separated string in settings.json, not a list, so it is
# split and trimmed here. Entries sharing a hierarchy path have their IPs
# concatenated rather than overwriting each other, and the path depth follows
# the deepest field present (Floor, then Bldg, then Area, then Parent).
- name: Build per-site device map
  ansible.builtin.set_fact:
    _site_device_map: >-
      {%- set ns = namespace(result={}) -%}
      {%- for entry in settings_data.project -%}
        {%- if entry.device_list is defined and entry.device_list -%}
          {%- set ips = entry.device_list.split(',') | map('trim') | reject('equalto', '') | list -%}
          {%- set parent = entry.HierarchyParent | default('Global') -%}
          {%- set area   = entry.HierarchyArea   | default('') -%}
          {%- set bldg   = entry.HierarchyBldg   | default('') -%}
          {%- set floor  = entry.HierarchyFloor  | default('') -%}
          {%- if floor -%}
            {%- set site_path = parent + '/' + area + '/' + bldg + '/' + floor -%}
          {%- elif bldg -%}
            {%- set site_path = parent + '/' + area + '/' + bldg -%}
          {%- elif area -%}
            {%- set site_path = parent + '/' + area -%}
          {%- else -%}
            {%- set site_path = parent -%}
          {%- endif -%}
          {%- if site_path in ns.result -%}
            {%- set ns.result = ns.result | combine({site_path: ns.result[site_path] + ips}) -%}
          {%- else -%}
            {%- set ns.result = ns.result | combine({site_path: ips}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.result }}

- name: --DEBUG-- Per-site device map
  when: catc_debug | default(false) | bool
  ansible.builtin.debug:
    var: _site_device_map

- name: Validate site device map is non-empty
  ansible.builtin.assert:
    that: _site_device_map | length > 0
    fail_msg: "No entries with device_list found in input JSON."
    success_msg: >-
      {{ _site_device_map | length }} site(s) /
      {{ _site_device_map.values() | map('length') | sum }} device(s) to provision.

# ── Step 4: Process each site ─────────────────────────────────────────────
#
# For each site:
#   a. Resolve the site UUID via the Sites REST API.
#   b. Resolve device UUIDs for every target management IP.
#   c. Check which devices are already provisioned at the site.
#   d. Submit POST /dna/intent/api/v1/sda/provisionDevices for any that are not.
#   e. Poll the returned async task until completion and report status.
#
- name: Process device provisioning for each site
  ansible.builtin.include_tasks: provision_site.yml
  loop: "{{ _site_device_map | dict2items }}"
  loop_control:
    loop_var: site_entry
    label: "{{ site_entry.key }}"
