---
# =============================================================================
# http_image_server / verify.yml  —  Stage 06.0 (A.5): prove the URLs work
# =============================================================================
# Confirms each image is actually downloadable before stage 06.2 tries to
# import it. Checks twice — from the server itself and from the control node —
# because a working localhost fetch with an unreachable public IP is the common
# failure mode (firewall or routing), and the two look identical in nginx logs.
#
# The Content-Type assertion is the important one: Catalyst Center's remote
# import silently fails if the URL returns text/html or text/plain instead of
# application/octet-stream.
#
# Pre:  image_plan          — [{path, filename, display_path, local_exists,
#                             remote_exists}] from stage_images.yml
#       image_server_ip, image_url_subdir
#       Handlers are flushed first so a pending nginx reload has applied.
#
# Post: http_check          — HEAD results from localhost on the server
#       http_check_remote   — HEAD results from the control node over the
#                             public IP; .status, .content_type, .content_length
#       Asserts per image: status 200 and content_type application/octet-stream.
#       Prints the published URL, size and content type for each image — the URL
#       must match settings.json swim.image_server_base_url used by stage 06.2.
#       Output is filename-only; control-node paths are never printed.
# =============================================================================

- name: Flush handlers before verification
  ansible.builtin.meta: flush_handlers

- name: Verify each image is served over HTTP (from the server itself)
  ansible.builtin.uri:
    url: "http://localhost/{{ image_url_subdir }}/{{ item.filename }}"
    method: HEAD
    status_code: 200
  loop: "{{ image_plan }}"
  loop_control:
    label: "{{ item.filename }}"
  register: http_check
  when: item.remote_exists or item.local_exists

- name: Verify TCP/80 reachability to the image server (from the control node)
  ansible.builtin.wait_for:
    host: "{{ image_server_ip }}"
    port: 80
    timeout: 10
    state: started
  delegate_to: localhost
  become: false

- name: Verify each image is reachable over HTTP on the public IP (from the control node)
  ansible.builtin.uri:
    url: "http://{{ image_server_ip }}/{{ image_url_subdir }}/{{ item.filename }}"
    method: HEAD
    status_code: 200
    return_content: false
  loop: "{{ image_plan }}"
  loop_control:
    label: "{{ item.filename }}"
  register: http_check_remote
  delegate_to: localhost
  become: false
  when: item.remote_exists or item.local_exists

- name: Assert each served image is a binary download
  ansible.builtin.assert:
    that:
      - item.status == 200
      - "'application/octet-stream' in (item.content_type | default(''))"
    fail_msg: >-
      The image URL for '{{ item.item.filename | default('n/a') }}'
      responded but not as application/octet-stream
      (got '{{ item.content_type | default('n/a') }}').
      Catalyst Center remote import expects a binary download.
    success_msg: >-
      Image '{{ item.item.filename | default('n/a') }}' reachable over HTTP
      as application/octet-stream
      ({{ item.content_length | default('n/a') }} bytes).
    # Without quiet, assert echoes the whole uri result, which embeds the
    # control-node source path from image_plan.
    quiet: true
  loop: "{{ http_check_remote.results }}"
  loop_control:
    label: "{{ item.item.filename | default('n/a') }}"
  when: item is not skipped

- name: Report the published image URLs
  ansible.builtin.debug:
    msg: >-
      Image server ready:
      http://{{ image_server_ip }}/{{ image_url_subdir }}/{{ item.item.filename }}
      ({{ item.content_length | default('n/a') }} bytes,
      {{ item.content_type | default('n/a') }})
  loop: "{{ http_check_remote.results }}"
  loop_control:
    label: "{{ item.item.filename | default('n/a') }}"
  when: item is not skipped
