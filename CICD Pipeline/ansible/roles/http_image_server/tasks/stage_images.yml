---
# =============================================================================
# http_image_server / stage_images.yml  —  Stage 06.0 (A.2): transfer images
# =============================================================================
# Uploads any image that is missing on the target, skipping those already
# present. Transfers are resumable, because a single IOS-XE .bin is ~1.3 GB and
# the dCloud VPN link drops long transfers.
#
# Pre:  image_local_paths       — absolute .bin paths on the control node
#       local_images.results[]  — control-node stat results (preflight.yml)
#       image_dir               — destination directory on the target
#       image_rsync_retries / _delay / _timeout — resume tuning
#       vault_image_server_user / vault_image_server_password — from vault.yml
#
# Post: remote_images.results[] — target-side stat per filename
#       image_plan — the staging decision table, consumed by verify.yml:
#         [{ path:          "/abs/cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            filename:      "cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            display_path:  ".../cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            local_exists:  true,
#            remote_exists: false }]
#       rsync_upload — per-image transfer results
#       On the target host: every planned image present in image_dir, owned
#       recursively by www-data.
#
# Fails when an image exists neither on the target nor on the control node.
# =============================================================================

# Task: Check whether each image already exists on the target
# Post: remote_images.results[].stat.exists per filename under image_dir
- name: Check whether each image already exists on the target
  ansible.builtin.stat:
    path: "{{ image_dir }}/{{ item | basename }}"
    get_checksum: false
  loop: "{{ image_local_paths }}"
  loop_control:
    label: "{{ item | basename }}"
  register: remote_images

# Example - the upgrade image already staged, the rollback image not yet
#   In : local_images.results = [
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            "stat": { "exists": true, "size": 1394606080 } },
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "stat": { "exists": true, "size": 1288490188 } }
#        ]
#        remote_images.results = [
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            "stat": { "exists": true } },
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "stat": { "exists": false } }
#        ]
#   Out: image_plan = [
#          { "path":          "/Users/net-admin/images/cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            "filename":      "cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            "display_path":  ".../cat9kv-universalk9.BLD_V262_THROTTLE_LATEST_20260529_003538.SSA.bin",
#            "local_exists":  true,
#            "remote_exists": true },
#          { "path":          "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "filename":      "cat9kv-universalk9.17.15.03.SPA.bin",
#            "display_path":  ".../cat9kv-universalk9.17.15.03.SPA.bin",
#            "local_exists":  true,
#            "remote_exists": false }
#        ]
#            → only cat9kv-universalk9.17.15.03.SPA.bin is uploaded
#
# Example - an image present on neither side
#   In : local_images.results = [
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "stat": { "exists": false } }
#        ]
#        remote_images.results = [
#          { "item": "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "stat": { "exists": false } }
#        ]
#   Out: image_plan = [
#          { "path":          "/Users/net-admin/images/cat9kv-universalk9.17.15.03.SPA.bin",
#            "filename":      "cat9kv-universalk9.17.15.03.SPA.bin",
#            "display_path":  ".../cat9kv-universalk9.17.15.03.SPA.bin",
#            "local_exists":  false,
#            "remote_exists": false }
#        ]
#            → the following fail task aborts the run
# zip() pairs the two stat result lists positionally, which is safe because both
# loops iterate image_local_paths in the same order. The plan is accumulated one
# element at a time rather than built in a single expression so the loop label
# reports the filename being evaluated.
# display_path is what every message prints; the absolute path stays in `path`,
# which is only ever consumed by the no_log rsync task.
- name: Build the per-image staging plan
  ansible.builtin.set_fact:
    image_plan: >-
      {{ image_plan | default([]) + [{
           'path': item.0.item,
           'filename': item.0.item | basename,
           'display_path': '.../' ~ (item.0.item | basename),
           'local_exists': item.0.stat.exists,
           'remote_exists': item.1.stat.exists
         }] }}
  loop: "{{ local_images.results | zip(remote_images.results) | list }}"
  loop_control:
    label: "{{ item.0.item | basename }}"

- name: Fail if any image is missing on both the target and the control node
  ansible.builtin.fail:
    msg: >-
      Image '{{ item.filename }}' is not present on {{ image_server_ip }}
      and the local source '{{ item.display_path }}' does not exist on the
      control node. Nothing to upload.
  loop: "{{ image_plan }}"
  loop_control:
    label: "{{ item.filename }}"
  when:
    - not item.remote_exists
    - not item.local_exists

# rsync + resume for low-MTU VPN; copy module stalls on large .bin over dCloud.
# ansible.posix.synchronize needs SSH keys and cannot use the vault SSH password;
# this target is password-auth only, so drive rsync directly via sshpass instead.
# Runs on the control node (delegate_to: localhost); --rsync-path="sudo rsync"
# writes into the www-data-owned image_dir using the target's passwordless sudo.
- name: Upload images to the server (missing on target, rsync + resume)
  ansible.builtin.command:
    argv:
      - sshpass
      - -e
      - rsync
      - --partial
      - --append
      - "--timeout={{ image_rsync_timeout }}"
      - "--rsync-path=sudo rsync"
      - -e
      - "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      - "{{ item.path }}"
      - "{{ vault_image_server_user }}@{{ image_server_ip }}:{{ image_dir }}/{{ item.filename }}"
  delegate_to: localhost
  become: false
  environment:
    SSHPASS: "{{ vault_image_server_password }}"
  no_log: true
  loop: "{{ image_plan }}"
  loop_control:
    label: "{{ item.filename }}"
  when:
    - not item.remote_exists
    - item.local_exists
  register: rsync_upload
  until: rsync_upload is succeeded
  retries: "{{ image_rsync_retries }}"
  delay: "{{ image_rsync_delay }}"
  changed_when: true

- name: Enforce ownership and permissions on the image directory
  ansible.builtin.file:
    path: "{{ image_dir }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true
