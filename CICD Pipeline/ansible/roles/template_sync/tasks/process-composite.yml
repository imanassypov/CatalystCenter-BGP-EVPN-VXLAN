---
# =============================================================================
# template_sync / process-composite.yml  —  Stage 07: build one composite config
# =============================================================================
# Turns one composite definition .yml fetched from GitHub into a
# template_workflow_manager config entry. Included once per element of
# enriched_composite_files by process-subfolder.yml, after the member templates
# have already been queued — CatC rejects a composite whose members do not exist.
#
# A composite carries no content of its own; it is a named ordered list of
# member templates (containing_templates), which is what stage 10 deploys.
#
# Pre:  composite_file (loop var): { name, path, content }
#         content is YAML: { composite_name: …, templates: [{name: …}, …] }
#       projectName — resolved CatC project for this subfolder
#       default_device_types, default_software_type, default_software_variant,
#       default_template_version
#
# Post: composite_def              — parsed YAML definition
#       composite_name             — composite_def.composite_name, else the
#                                    filename with .yml swapped for .j2
#       composite_template_names   — ordered member template names
#       containing_templates_list  — member stubs {name, composite: false,
#                                    project_name, language, device_types, …}
#                                    reset to [] at the end of each iteration
#       composite_workflow_configs — appended with one entry:
#         { configuration_templates: { template_name, project_name,
#           composite: true, template_content: "", containing_templates, … } }
# =============================================================================

- name: Load composite definition from {{ composite_file.name }}
  set_fact:
    composite_def: "{{ composite_file.content | from_yaml }}"

- name: Extract composite metadata
  set_fact:
    composite_name: "{{ composite_def.composite_name | default((composite_file.name | regex_replace('\\.yml$', '.j2'))) }}"
    composite_template_names: "{{ composite_def.templates | map(attribute='name') | list }}"

- name: Build containing templates list
  set_fact:
    containing_templates_list: "{{ containing_templates_list | default([]) + [{'name': item, 'composite': false, 'project_name': projectName, 'description': 'description','language': 'JINJA', 'device_types': default_device_types,'software_type': default_software_type, 'software_variant': default_software_variant, 'templateParams': [], 'tags': []}] }}"
  with_items: "{{ composite_template_names }}"

- name: Build composite workflow configuration for {{ composite_name }}
  set_fact:
    composite_workflow_configs: "{{ composite_workflow_configs | default([]) + [composite_config] }}"
  vars:
    composite_config:
      configuration_templates:
        template_name: "{{ composite_name }}"
        project_name: "{{ projectName }}"
        composite: true
        language: "JINJA"
        template_content: ""
        template_description: "Composite template synced from Git repository"
        device_types: "{{ default_device_types }}"
        software_type: "{{ default_software_type }}"
        software_variant: "{{ default_software_variant }}"
        software_version: null
        template_params: []
        failure_policy: "ABORT_TARGET_ON_ERROR"
        version: "{{ default_template_version }}"
        containing_templates: "{{ containing_templates_list }}"
        tags: []

- name: Reset containing templates list
  set_fact:
    containing_templates_list: []