---
# =============================================================================
# template_sync / process-subfolder.yml  —  Stage 07: sync one repo subfolder
# =============================================================================
# Syncs a single repository subfolder into its own Catalyst Center Template
# Programmer project. Included once per entry of git_repo_subfolders by
# roles/template_sync/tasks/main.yml. The source file list is built once at play
# level and re-filtered here per subfolder.
#
# Content is read from GitHub (raw.githubusercontent.com) or from
# template_local_root, depending on template_source. Commit metadata and diff
# headers exist only for the Git source; local syncs get a timestamp comment.
#
# Processing order is derived from the composite definitions, not hardcoded:
# regular templates are pushed first so that composite members already exist.
#
# Pre:  subfolder_item (loop var): { path, project_name }
#       repo_tree_entries — unified [{ path }] file list built at play level by
#                           main.yml from either GitHub or template_local_root
#       template_source, template_local_root
#       git_repo_slug, git_branch, git_api_base, git_auth_header (git source only)
#       template_extension (j2), include_diff_header,
#       catc_template_summary_maxchar, default_device_types,
#       default_software_type / _variant, default_template_version
#
# Post: git_tree_prefix                — "<subfolder path>/" filter prefix
#       api_template_files             — blobs matching *.j2 under the prefix
#       api_composite_files            — blobs matching *.yml under the prefix
#       project_name                   — subfolder_item.project_name, else the
#                                        subfolder basename, else the first
#                                        template's parent folder basename
#       enriched_template_files        — [{name, path, content, commit_message,
#                                          diff_content}]
#       enriched_composite_files       — [{name, path, content}]
#       composite_referenced_templates — member names pulled from composites
#       priority_template_list / regular_template_list
#       sorted_template_files          — regular first, then composite members
#       template_workflow_configs      — built by process-template.yml
#       composite_workflow_configs     — built by process-composite.yml
#       template_sync_result / composite_sync_result — WFM module results
#       sync_summary                   — appended {subfolder, project,
#                                        templates_synced, composites_synced}
#       In Catalyst Center: one project per subfolder, populated and versioned.
#
# Module: cisco.dnac.template_workflow_manager (state: merged)
# =============================================================================

# Reset per-subfolder accumulators so facts never leak across iterations/projects.
# Example - second iteration of git_repo_subfolders, entering "DMZ 01" after
# "Building P0" has already been synced.
#   In : enriched_template_files        = [ {"name": "DEFN-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2", "content": "{## CATC: ... ##}", "commit_message": "2026-08-01T09:14:22Z | Add red VRF [Igor Manassypov]", "diff_content": ""} ]
#        enriched_composite_files       = [ {"name": "BGP-EVPN-BUILD.yml", "path": "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml", "content": "templates:\n  - name: FABRIC-VRF.j2\n"} ]
#        composite_referenced_templates = ["FABRIC-VRF.j2"]
#        priority_template_list         = [ {"name": "FABRIC-VRF.j2"} ]
#        regular_template_list          = [ {"name": "DEFN-VRF.j2"} ]
#        sorted_template_files          = [ {"name": "DEFN-VRF.j2"}, {"name": "FABRIC-VRF.j2"} ]
#        template_workflow_configs      = [ {"configuration_templates": {"name": "DEFN-VRF.j2"}} ]
#        composite_workflow_configs     = [ {"configuration_templates": {"name": "BGP-EVPN-BUILD.j2"}} ]
#        containing_templates_list      = [ {"name": "FABRIC-VRF.j2", "id": "c3000000-0000-4000-8000-000000000021"} ]
#        template_sync_result           = {"changed": true, "failed": false}
#        composite_sync_result          = {"changed": true, "failed": false}
#   Out: every one of the ten facts above is reset to [] or {}
# Without this reset the DMZ project would inherit the Site project's templates,
# because set_fact values persist for the whole play.
- name: Reset per-subfolder accumulators
  set_fact:
    enriched_template_files: []
    enriched_composite_files: []
    composite_referenced_templates: []
    priority_template_list: []
    regular_template_list: []
    sorted_template_files: []
    template_workflow_configs: []
    composite_workflow_configs: []
    containing_templates_list: []
    template_sync_result: {}
    composite_sync_result: {}

# Example - configured subfolder
#   In : subfolder_item = {
#          "path":         "Catalyst Center Templates/Site BGP EVPN Templates",
#          "project_name": "Building P0"
#        }
#   Out: git_tree_prefix = "Catalyst Center Templates/Site BGP EVPN Templates/"
#
# Example - repo-root scan
#   In : subfolder_item = { "path": "", "project_name": "Building P0" }
#   Out: git_tree_prefix = ""
# The empty prefix is deliberate: "^" matches every path, so a blank path scans
# the whole repository instead of matching nothing.
- name: Build subfolder prefix filter
  set_fact:
    git_tree_prefix: "{{ (subfolder_item.path + '/') if (subfolder_item.path is defined and subfolder_item.path | length > 0) else '' }}"

# Example - input tree trimmed to four blobs and one tree entry so the whole
# transformation is visible. The real Site subfolder yields 24 templates and
# 1 composite.
#   In : git_tree_prefix = "Catalyst Center Templates/Site BGP EVPN Templates/"
#        repo_tree_response.json.tree = [
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
#            "mode": "100644", "type": "blob",
#            "sha":  "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "size": 2048 },
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
#            "mode": "100644", "type": "blob",
#            "sha":  "b2c3d4e5f60718293a4b5c6d7e8f901234567890", "size": 1536 },
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml",
#            "mode": "100644", "type": "blob",
#            "sha":  "d4e5f6a7b8c9d0e1f2031425364758697a8b9c0d", "size": 512 },
#          { "path": "Catalyst Center Templates/DMZ BGP EVPN Templates/DEFN-DMZ.j2",
#            "mode": "100644", "type": "blob",
#            "sha":  "e5f6a7b8c9d0e1f2031425364758697a8b9c0d1e", "size": 900 },
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates",
#            "mode": "040000", "type": "tree",
#            "sha":  "99aabbccddeeff00112233445566778899aabbcc" }
#        ]
#   Out: api_template_files = [
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
#            "mode": "100644", "type": "blob",
#            "sha":  "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "size": 2048 },
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
#            "mode": "100644", "type": "blob",
#            "sha":  "b2c3d4e5f60718293a4b5c6d7e8f901234567890", "size": 1536 }
#        ]
#        api_composite_files = [
#          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml",
#            "mode": "100644", "type": "blob",
#            "sha":  "d4e5f6a7b8c9d0e1f2031425364758697a8b9c0d", "size": 512 }
#        ]
# The tree entry and the DMZ blob are both dropped: the first never reaches this
# list (main.yml keeps blobs only), the second fails the prefix search.
- name: Build template and composite file lists from repository tree
  set_fact:
    api_template_files: "{{ repo_tree_entries | selectattr('path', 'search', '^' + git_tree_prefix) | selectattr('path', 'search', '\\.' + template_extension + '$') | list }}"
    api_composite_files: "{{ repo_tree_entries | selectattr('path', 'search', '^' + git_tree_prefix) | selectattr('path', 'search', '\\.yml$') | list }}"

- name: Warn and skip empty subfolder
  when: api_template_files | length == 0
  debug:
    msg: "No '{{ template_extension }}' templates found under '{{ subfolder_item.path | default('(repo root)') }}' - skipping this subfolder."

- name: Process subfolder (templates present)
  when: api_template_files | length > 0
  block:
    # Project name resolution order:
    #   1. Explicit subfolder_item.project_name
    #   2. Basename of the subfolder path
    #   3. Basename of the first template's parent folder (repo-root scans)
    #
    # Example - explicit project_name (rule 1, how this repo is configured)
    #   In : subfolder_item = {
    #          "path":         "Catalyst Center Templates/Site BGP EVPN Templates",
    #          "project_name": "Building P0"
    #        }
    #   Out: project_name = "Building P0"
    #
    # Example - no project_name, path present (rule 2)
    #   In : subfolder_item = {
    #          "path": "Catalyst Center Templates/DMZ BGP EVPN Templates"
    #        }
    #   Out: project_name = "DMZ BGP EVPN Templates"
    #
    # Example - repo-root scan, falls back to the first template's folder (rule 3)
    #   In : subfolder_item    = { "path": "" }
    #        api_template_files = [
    #          { "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "mode": "100644", "type": "blob",
    #            "sha":  "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "size": 2048 }
    #        ]
    #   Out: project_name = "Site BGP EVPN Templates"
    # project_name must match an existing Template Programmer project, or the
    # workflow manager creates one with that name.
    - name: Resolve Catalyst Center project name for this subfolder
      set_fact:
        project_name: >-
          {{
            subfolder_item.project_name
            if (subfolder_item.project_name is defined and subfolder_item.project_name | length > 0)
            else (subfolder_item.path | basename
                  if (subfolder_item.path is defined and subfolder_item.path | length > 0)
                  else (api_template_files[0].path | dirname | basename))
          }}

    - name: --DEBUG-- Subfolder and project
      when: catc_debug | default(false) | bool
      debug:
        msg: "Subfolder '{{ subfolder_item.path | default('(repo root)') }}' -> project '{{ project_name }}'"

    - name: Fetch template file contents from GitHub
      when: (template_source | default('git')) == 'git'
      uri:
        url: "https://raw.githubusercontent.com/{{ git_repo_slug }}/{{ git_branch | default('HEAD') }}/{{ item.path | replace(' ', '%20') }}"
        method: GET
        headers: "{{ git_auth_header }}"
        return_content: true
        status_code: 200
      loop: "{{ api_template_files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: template_content_results

    # slurp rather than the file lookup so content is byte-identical to the Git
    # path, which preserves trailing newlines.
    - name: Read template file contents from local directory
      when: (template_source | default('git')) == 'local'
      ansible.builtin.slurp:
        src: "{{ template_local_root }}/{{ item.path }}"
      loop: "{{ api_template_files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: local_template_content_results

    - name: Fetch last commit info for each template file
      when: (template_source | default('git')) == 'git'
      uri:
        url: "{{ git_api_base }}/repos/{{ git_repo_slug }}/commits?path={{ item.path | replace(' ', '%20') }}&per_page=1&sha={{ git_branch | default('HEAD') }}"
        method: GET
        headers: "{{ git_auth_header | combine({'Accept': 'application/vnd.github+json'}) }}"
        status_code: 200
      loop: "{{ api_template_files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: template_commit_results

    - name: Fetch commit diff for each template file
      when:
        - (template_source | default('git')) == 'git'
        - include_diff_header and template_commit_results.results[diff_idx].json | length > 0
      uri:
        url: "{{ git_api_base }}/repos/{{ git_repo_slug }}/commits/{{ template_commit_results.results[diff_idx].json[0].sha }}"
        method: GET
        headers: "{{ git_auth_header | combine({'Accept': 'application/vnd.github+json'}) }}"
        status_code: 200
      loop: "{{ api_template_files }}"
      loop_control:
        index_var: diff_idx
        label: "{{ item.path | basename }}"
      register: template_diff_results

    # Example - one template, last commit found, diff header enabled
    #   In : item = {
    #          "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #          "mode": "100644", "type": "blob",
    #          "sha":  "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "size": 2048
    #        }
    #        tmpl_idx = 0
    #        catc_template_summary_maxchar = 255
    #        template_content_results.results[0].content =
    #          "{## CATC: productFamily=Switches and Hubs ##}\n{% set DEFN_VRF = [] %}\n"
    #        template_commit_results.results[0].json = [
    #          {
    #            "sha": "f1e2d3c4b5a60718293a4b5c6d7e8f9012345678",
    #            "commit": {
    #              "author":  { "name": "Igor Manassypov",
    #                           "email": "imanassy@cisco.com",
    #                           "date": "2026-08-01T09:14:22Z" },
    #              "message": "Add red VRF definition"
    #            }
    #          }
    #        ]
    #        template_diff_results.results[0].json.files = [
    #          {
    #            "filename": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "status":   "modified",
    #            "additions": 3, "deletions": 0, "changes": 3,
    #            "patch": "@@ -1,2 +1,5 @@\n+{% set DEFN_VRF = [] %}"
    #          }
    #        ]
    #   Out: enriched_template_files = [
    #          {
    #            "name":           "DEFN-VRF.j2",
    #            "path":           "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "content":        "{## CATC: productFamily=Switches and Hubs ##}\n{% set DEFN_VRF = [] %}\n",
    #            "commit_message": "2026-08-01T09:14:22Z | Add red VRF definition [Igor Manassypov]",
    #            "diff_content":   "@@ -1,2 +1,5 @@\n+{% set DEFN_VRF = [] %}"
    #          }
    #        ]
    #
    # Example - file has no commit history (new, unpushed file)
    #   In : template_commit_results.results[0].json = []
    #   Out: enriched_template_files[0].commit_message = "Synced from Git"
    #        enriched_template_files[0].diff_content   = ""
    # Example - local source, no commit history available
    #   In : template_source = "local"
    #        start_timestamp.date = "2026-08-13", start_timestamp.time = "09:14:22"
    #   Out: enriched_template_files[0].commit_message = "Synced from local directory 2026-08-13 09:14:22"
    #        enriched_template_files[0].diff_content   = ""
    # commit_message becomes the Catalyst Center template version comment, so it
    # is truncated to catc_template_summary_maxchar to avoid an API rejection.
    - name: Build enriched template file objects
      set_fact:
        enriched_template_files: "{{ enriched_template_files | default([]) + [enriched] }}"
      vars:
        _from_git: "{{ (template_source | default('git')) == 'git' }}"
        _commit_list: "{{ template_commit_results.results[tmpl_idx].json if (template_source | default('git')) == 'git' else [] }}"
        _commit: "{{ _commit_list[0] if _commit_list | length > 0 else {} }}"
        _local_message: "{{ 'Synced from local directory ' + start_timestamp.date + ' ' + start_timestamp.time }}"
        _commit_message: "{{ (_commit.commit.author.date | default('') + ' | ' + _commit.commit.message | default('') + ' [' + _commit.commit.author.name | default('') + ']')[:catc_template_summary_maxchar] if _commit else (_local_message if not (_from_git | bool) else 'Synced from Git') }}"
        _diff_files: "{{ template_diff_results.results[tmpl_idx].json.files | default([]) if ((template_source | default('git')) == 'git' and include_diff_header and template_diff_results is defined and not (template_diff_results.results[tmpl_idx].skipped | default(false))) else [] }}"
        _file_patch: "{{ (_diff_files | selectattr('filename', 'eq', item.path) | list | first).patch | default('') if _diff_files | length > 0 else '' }}"
        enriched:
          name: "{{ item.path | basename }}"
          path: "{{ item.path }}"
          content: "{{ template_content_results.results[tmpl_idx].content if (template_source | default('git')) == 'git' else (local_template_content_results.results[tmpl_idx].content | b64decode) }}"
          commit_message: "{{ _commit_message }}"
          diff_content: "{{ _file_patch }}"
      loop: "{{ api_template_files }}"
      loop_control:
        index_var: tmpl_idx
        label: "{{ item.path | basename }}"

    - name: Fetch composite definition file contents from GitHub
      when:
        - (template_source | default('git')) == 'git'
        - api_composite_files | length > 0
      uri:
        url: "https://raw.githubusercontent.com/{{ git_repo_slug }}/{{ git_branch | default('HEAD') }}/{{ item.path | replace(' ', '%20') }}"
        method: GET
        headers: "{{ git_auth_header }}"
        return_content: true
        status_code: 200
      loop: "{{ api_composite_files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: composite_content_results

    - name: Read composite definition file contents from local directory
      when:
        - (template_source | default('git')) == 'local'
        - api_composite_files | length > 0
      ansible.builtin.slurp:
        src: "{{ template_local_root }}/{{ item.path }}"
      loop: "{{ api_composite_files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: local_composite_content_results

    # Example
    #   In : item = {
    #          "path": "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml",
    #          "mode": "100644", "type": "blob",
    #          "sha":  "d4e5f6a7b8c9d0e1f2031425364758697a8b9c0d", "size": 512
    #        }
    #        comp_idx = 0
    #        composite_content_results.results[0].content =
    #          "templates:\n  - name: \"FABRIC-VRF.j2\"\n  - name: \"FABRIC-LOOPBACKS.j2\"\n"
    #   Out: enriched_composite_files = [
    #          {
    #            "name":    "BGP-EVPN-BUILD.yml",
    #            "path":    "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml",
    #            "content": "templates:\n  - name: \"FABRIC-VRF.j2\"\n  - name: \"FABRIC-LOOPBACKS.j2\"\n"
    #          }
    #        ]
    # Composites carry no commit_message or diff_content - the version comment is
    # taken from the member templates instead.
    - name: Build enriched composite file objects
      when: api_composite_files | length > 0
      set_fact:
        enriched_composite_files: "{{ enriched_composite_files | default([]) + [enriched] }}"
      vars:
        enriched:
          name: "{{ item.path | basename }}"
          path: "{{ item.path }}"
          content: "{{ composite_content_results.results[comp_idx].content if (template_source | default('git')) == 'git' else (local_composite_content_results.results[comp_idx].content | b64decode) }}"
      loop: "{{ api_composite_files }}"
      loop_control:
        index_var: comp_idx
        label: "{{ item.path | basename }}"

    # DYNAMIC TEMPLATE PROCESSING ORDER
    # Template processing order is derived from composite definitions:
    #   1. Find composite definition YAML files (.yml) in the subfolder
    #   2. Extract templates referenced by those composites (dependencies)
    #   3. Process regular templates first (so dependencies exist), then priority
    #      (referenced) templates, then the composites themselves.
    # Example - the real BGP-EVPN-BUILD.yml composite
    #   In : enriched_composite_files = [
    #          {
    #            "name":    "BGP-EVPN-BUILD.yml",
    #            "path":    "Catalyst Center Templates/Site BGP EVPN Templates/BGP-EVPN-BUILD.yml",
    #            "content": "templates:\n  - name: \"FABRIC-VRF.j2\"\n  - name: \"FABRIC-LOOPBACKS.j2\"\n  - name: \"FABRIC-BORDER-DMZ-TUNNELS.j2\"\n  - name: \"FABRIC-L3OUT.j2\"\n  - name: \"FABRIC-NVE.j2\"\n  - name: \"FABRIC-MCAST.j2\"\n  - name: \"FABRIC-EVPN.j2\"\n  - name: \"FABRIC-OVERLAY.j2\"\n  - name: \"FABRIC-CLIENT-PORTS.j2\"\n  - name: \"FABRIC-NAC.j2\"\n  - name: \"FABRIC-TELEMETRY-SPLUNK.j2\"\n"
    #          }
    #        ]
    #   Out: composite_referenced_templates = [
    #          "FABRIC-VRF.j2",
    #          "FABRIC-LOOPBACKS.j2",
    #          "FABRIC-BORDER-DMZ-TUNNELS.j2",
    #          "FABRIC-L3OUT.j2",
    #          "FABRIC-NVE.j2",
    #          "FABRIC-MCAST.j2",
    #          "FABRIC-EVPN.j2",
    #          "FABRIC-OVERLAY.j2",
    #          "FABRIC-CLIENT-PORTS.j2",
    #          "FABRIC-NAC.j2",
    #          "FABRIC-TELEMETRY-SPLUNK.j2"
    #        ]
    # The list accumulates across every composite in the subfolder, so a template
    # referenced by two composites appears twice - harmless, it is only used for
    # membership tests below.
    - name: Extract templates referenced in composite definitions
      set_fact:
        composite_referenced_templates: "{{ composite_referenced_templates | default([]) + (item.content | from_yaml).templates | map(attribute='name') | list }}"
      loop: "{{ enriched_composite_files | default([]) }}"
      when: enriched_composite_files is defined and enriched_composite_files | length > 0
      loop_control:
        label: "{{ item.name }}"

    - name: --DEBUG-- Templates referenced in composites
      when: (catc_debug | default(false) | bool) and composite_referenced_templates is defined
      debug:
        msg: "{{ composite_referenced_templates }}"

    # Example - input trimmed to four templates so the split is visible
    #   In : composite_referenced_templates = ["FABRIC-VRF.j2", "FABRIC-LOOPBACKS.j2"]
    #        enriched_template_files = [
    #          { "name": "DEFN-VRF.j2",
    #            "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "content": "{% set DEFN_VRF = [] %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FUNC-VRF-LOOKUP.j2",
    #            "path": "Catalyst Center Templates/Site BGP EVPN Templates/FUNC-VRF-LOOKUP.j2",
    #            "content": "{% macro vrf_definition() %}{% endmacro %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FABRIC-VRF.j2",
    #            "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
    #            "content": "vrf definition red",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FABRIC-LOOPBACKS.j2",
    #            "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-LOOPBACKS.j2",
    #            "content": "interface Loopback0",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    #   Out: regular_template_list = [
    #          { "name": "DEFN-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "content": "{% set DEFN_VRF = [] %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FUNC-VRF-LOOKUP.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FUNC-VRF-LOOKUP.j2",
    #            "content": "{% macro vrf_definition() %}{% endmacro %}",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    #        priority_template_list = [
    #          { "name": "FABRIC-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
    #            "content": "vrf definition red",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FABRIC-LOOPBACKS.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-LOOPBACKS.j2",
    #            "content": "interface Loopback0",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    # DEFN and FUNC templates are never composite members, so they always land in
    # regular_template_list and are therefore pushed first.
    - name: Build template lists based on composite references
      set_fact:
        priority_template_list: "{{ priority_template_list + [item] if (composite_referenced_templates is defined and item.name in composite_referenced_templates) else priority_template_list }}"
        regular_template_list: "{{ regular_template_list + [item] if (composite_referenced_templates is not defined or item.name not in composite_referenced_templates) else regular_template_list }}"
      loop: "{{ enriched_template_files }}"

    # Example
    #   In : regular_template_list = [
    #          { "name": "DEFN-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "content": "{% set DEFN_VRF = [] %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FUNC-VRF-LOOKUP.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FUNC-VRF-LOOKUP.j2",
    #            "content": "{% macro vrf_definition() %}{% endmacro %}",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    #        priority_template_list = [
    #          { "name": "FABRIC-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
    #            "content": "vrf definition red",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    #   Out: sorted_template_files = [
    #          { "name": "DEFN-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/DEFN-VRF.j2",
    #            "content": "{% set DEFN_VRF = [] %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FUNC-VRF-LOOKUP.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FUNC-VRF-LOOKUP.j2",
    #            "content": "{% macro vrf_definition() %}{% endmacro %}",
    #            "commit_message": "Synced from Git", "diff_content": "" },
    #          { "name": "FABRIC-VRF.j2", "path": "Catalyst Center Templates/Site BGP EVPN Templates/FABRIC-VRF.j2",
    #            "content": "vrf definition red",
    #            "commit_message": "Synced from Git", "diff_content": "" }
    #        ]
    # Composite members are pushed last so that a composite created afterwards
    # can resolve every member by name to an existing template ID.
    - name: Set template processing order (regular first for dependencies, then priority)
      set_fact:
        sorted_template_files: "{{ regular_template_list + priority_template_list }}"

    - name: --DEBUG-- show sorted template list
      when: catc_debug | default(false) | bool
      debug:
        msg: "{{ sorted_template_files | map(attribute='name') | list }}"

    - name: Process regular templates in correct order
      ansible.builtin.include_tasks: process-template.yml
      with_items: "{{ sorted_template_files }}"
      loop_control:
        loop_var: template_file
        index_var: template_idx

    - name: --DEBUG-- show template configurations
      when: catc_debug | default(false) | bool
      debug:
        msg: "{{ template_workflow_configs }}"

    - name: Process composite templates
      when: enriched_composite_files is defined and enriched_composite_files | length > 0
      ansible.builtin.include_tasks: process-composite.yml
      with_items: "{{ enriched_composite_files | default([]) }}"
      loop_control:
        loop_var: composite_file

    - name: --DEBUG-- show composite configurations
      when: (catc_debug | default(false) | bool) and composite_workflow_configs is defined
      debug:
        msg: "{{ composite_workflow_configs }}"

    - name: Synchronize all templates using template_workflow_manager
      when: template_workflow_configs is defined and template_workflow_configs | length > 0
      cisco.dnac.template_workflow_manager:
        state: merged
        config: "{{ template_workflow_configs }}"
      register: template_sync_result

    - name: --DEBUG-- show template sync results
      when: catc_debug | default(false) | bool
      debug:
        msg: "{{ template_sync_result }}"

    - name: Synchronize composite templates using template_workflow_manager
      when: composite_workflow_configs is defined and composite_workflow_configs | length > 0
      cisco.dnac.template_workflow_manager:
        state: merged
        config: "{{ composite_workflow_configs }}"
      register: composite_sync_result

    - name: --DEBUG-- show composite sync results
      when: (catc_debug | default(false) | bool) and composite_sync_result is defined
      debug:
        msg: "{{ composite_sync_result }}"

    - name: Record per-project sync summary
      set_fact:
        sync_summary: "{{ sync_summary | default([]) + [project_summary] }}"
      vars:
        project_summary:
          subfolder: "{{ subfolder_item.path | default('(repo root)') }}"
          project: "{{ project_name }}"
          templates_synced: "{{ template_workflow_configs | default([]) | length }}"
          composites_synced: "{{ composite_workflow_configs | default([]) | length }}"

    - name: Display per-project synchronization summary
      debug:
        msg:
          - "Subfolder synced: {{ subfolder_item.path | default('(repo root)') }}"
          - "Project: {{ project_name }}"
          - "Regular templates synced: {{ template_workflow_configs | default([]) | length }}"
          - "Composite templates synced: {{ composite_workflow_configs | default([]) | length }}"
