---
# =============================================================================
# yangsuite_docker / configure_firewall.yml  —  open the published ports in ufw
# =============================================================================
# Opens exactly the ports that patch_compose_ports.yml actually published, plus
# the telemetry ports the yangsuite container listens on. The HTTP port is only
# opened when yangsuite_publish_http is true, so the rule set stays in sync
# with the compose bindings.
#
# Skipped entirely when ufw is absent or inactive — this never enables a
# firewall that the operator had turned off.
#
# Pre:  yangsuite_manage_ufw — true; set false to skip firewall management
#       yangsuite_https_port (8443), yangsuite_restconf_port (8444)
#       yangsuite_http_port (8080), gated on yangsuite_publish_http
#       yangsuite_firewall_extra_ports — gNMI / gRPC MDT:
#         50051, 50052, 9339, 57344, 57345
#
# Post: ufw_status — .rc and .stdout from `ufw status`
#       On the target host: allow rules for each computed TCP port, only when
#       ufw reports "Status: active".
# =============================================================================

- name: Detect whether ufw is installed and active
  ansible.builtin.command:
    cmd: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false

- name: Open YANG Suite ports in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: >-
    {{
      ([yangsuite_https_port, yangsuite_restconf_port]
       + ([yangsuite_http_port] if yangsuite_publish_http | bool else []))
      + (yangsuite_firewall_extra_ports | default([]))
    }}
  when:
    - yangsuite_manage_ufw | bool
    - ufw_status.rc == 0
    - "'Status: active' in ufw_status.stdout"
