---
# =============================================================================
# yangsuite_docker / install_docker.yml  —  install Docker engine + Compose v2
# =============================================================================
# Installs Docker only when it is actually missing. Every apt task is gated on
# a prior version probe, so re-runs on a host that already has Docker (possibly
# a newer upstream build) touch nothing.
#
# containerd is installed separately because the Ubuntu 20.04 docker.io package
# does not pull it in reliably.
#
# Pre:  become: true; target is Debian/Ubuntu with apt
#
# Post: yangsuite_docker_cli_check.rc     — 0 when `docker --version` works
#       yangsuite_docker_compose_check.rc — 0 when `docker compose version` works
#       apt_cache_update                  — registered, never fails the play
#       On the target host: docker.io + docker-compose-v2 present, docker
#       service started and enabled.
# =============================================================================

- name: Check whether Docker CLI is already installed
  ansible.builtin.command: docker --version
  register: yangsuite_docker_cli_check
  changed_when: false
  failed_when: false

- name: Check whether Docker Compose plugin is available
  ansible.builtin.command: docker compose version
  register: yangsuite_docker_compose_check
  changed_when: false
  failed_when: false

- name: Refresh apt cache (best effort)
  ansible.builtin.apt:
    update_cache: true
  register: apt_cache_update
  failed_when: false
  when: yangsuite_docker_cli_check.rc != 0 or yangsuite_docker_compose_check.rc != 0

- name: Install containerd (docker.io dependency on Ubuntu 20.04)
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: false
  when: yangsuite_docker_cli_check.rc != 0

- name: Install Docker engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: false
  when: yangsuite_docker_cli_check.rc != 0 or yangsuite_docker_compose_check.rc != 0

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
