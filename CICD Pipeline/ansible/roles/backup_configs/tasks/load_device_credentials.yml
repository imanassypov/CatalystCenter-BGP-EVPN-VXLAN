---
# =============================================================================
# backup_configs / load_device_credentials.yml  —  Stage 11.0 (play 1)
# =============================================================================
# Pushes device SSH credentials from settings.json (SSOT) onto backup target host
# facts so connection.yml can template ansible_user/password/become_password.
#
# Prerequisites: catc_common.load_settings → settings_data
# Source: settings_data.project[0].device_credentials.cli_credential
# =============================================================================

- name: Validate settings_data is loaded
  ansible.builtin.assert:
    that:
      - settings_data is defined
      - settings_data.project is defined
      - settings_data.project | length > 0
    fail_msg: >-
      settings_data must be loaded before device credentials
      (import catc_common load_settings first).

# Example
#   In : settings_data.project[0].device_credentials = {
#          "cli_credential": {
#            "description":     "CLI-net-admin",
#            "username":        "net-admin",
#            "password":        "C1sco12345",
#            "enable_password": "C1sco12345"
#          },
#          "snmp_v2c_read":  { "description": "RO", "read_community":  "RO" },
#          "snmp_v2c_write": { "description": "RW", "write_community": "RW" },
#          "netconf_credential": { "description":  "NETCONF-netadmin",
#                                  "netconf_port": "830" }
#        }
#   Out: _cli_cred = {
#          "description":     "CLI-net-admin",
#          "username":        "net-admin",
#          "password":        "C1sco12345",
#          "enable_password": "C1sco12345"
#        }
# Only the CLI credential is used for SSH backups; the SNMP and NETCONF entries
# are consumed by stage 03_credentials instead.
- name: Extract CLI credential from settings.json
  ansible.builtin.set_fact:
    _cli_cred: "{{ settings_data.project[0].device_credentials.cli_credential | default({}) }}"

- name: Validate cli_credential in settings.json
  ansible.builtin.assert:
    that:
      - _cli_cred.username is defined
      - _cli_cred.username | length > 0
      - _cli_cred.password is defined
      - _cli_cred.password | length > 0
    fail_msg: >-
      settings.json project[0].device_credentials.cli_credential must define
      username and password (same SSOT used by stage 03_credentials).

# Example - three of the target hosts shown; the same three facts are set on
# every host in backup_target_hosts.
#   In : _cli_cred = {
#          "description":     "CLI-net-admin",
#          "username":        "net-admin",
#          "password":        "C1sco12345",
#          "enable_password": "C1sco12345"
#        }
#        backup_target_hosts = ["spine01", "leaf01", "core01"]
#   Out: hostvars = {
#          "spine01": { "vault_device_username":        "net-admin",
#                       "vault_device_password":        "C1sco12345",
#                       "vault_device_enable_password": "C1sco12345" },
#          "leaf01":  { "vault_device_username":        "net-admin",
#                       "vault_device_password":        "C1sco12345",
#                       "vault_device_enable_password": "C1sco12345" },
#          "core01":  { "vault_device_username":        "net-admin",
#                       "vault_device_password":        "C1sco12345",
#                       "vault_device_enable_password": "C1sco12345" }
#        }
#
# Example - cli_credential omits enable_password
#   In : _cli_cred = {
#          "description": "CLI-net-admin",
#          "username":    "net-admin",
#          "password":    "C1sco12345"
#        }
#        backup_target_hosts = ["spine01"]
#   Out: hostvars = {
#          "spine01": { "vault_device_username":        "net-admin",
#                       "vault_device_password":        "C1sco12345",
#                       "vault_device_enable_password": "C1sco12345" }
#        }
# enable_password falls back to password, so a device without a separate enable
# secret still authenticates. The facts land on the delegated host, not on
# localhost, which is why delegate_facts is set.
- name: Push device SSH credentials to backup targets from settings.json
  ansible.builtin.set_fact:
    vault_device_username: "{{ _cli_cred.username }}"
    vault_device_password: "{{ _cli_cred.password }}"
    vault_device_enable_password: "{{ _cli_cred.enable_password | default(_cli_cred.password) }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  # Delegate loads iosxe/nxos connection.yml which templates vault_device_* before
  # those facts exist — override connection vars so templating does not fail.
  vars:
    ansible_connection: local
    ansible_user: "{{ _cli_cred.username }}"
    ansible_password: "{{ _cli_cred.password }}"
    ansible_become: false
    ansible_become_password: "{{ _cli_cred.enable_password | default(_cli_cred.password) }}"
  loop: "{{ backup_target_hosts }}"
  no_log: true
