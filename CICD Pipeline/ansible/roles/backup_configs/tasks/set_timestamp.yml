---
# =============================================================================
# backup_configs / set_timestamp.yml  —  Stage 11.0 (play 1 of 3)
# =============================================================================
# Creates a shared timestamp fact on localhost used by iosxe/nxos backup plays
# so all device configs land in the same directory:
#   {{ backup_root_dir }}/{{ backup_timestamp }}/
# =============================================================================

# Example
#   In : backup_root_dir = "/Users/net-admin/repo/CICD Pipeline/ansible/playbooks/../config-backups"
#        system clock    = 2026-07-06 16:10:42 America/Toronto
#   Out: backup_timestamp = "20260706-161042"
#        derived by the calling play as:
#        backup_output_dir = "/Users/net-admin/repo/CICD Pipeline/ansible/playbooks/../config-backups/20260706-161042"
# Set once on localhost and read back through hostvars['localhost'] by the
# iosxe and nxos plays, so every device config for one run shares a directory.
# Computing it per-play would straddle a minute boundary and split the run.
- name: Set shared backup timestamp
  ansible.builtin.set_fact:
    backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
