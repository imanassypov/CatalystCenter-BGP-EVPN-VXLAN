---
# =============================================================================
# 05_assign_to_site.yml  —  Pipeline stage 05
# =============================================================================
# Moves discovered devices out of Global and into their designated site.
# Site membership is what later stages key on — SWIM golden-image tagging
# (06.2) and provisioning (09) both target devices by site. Role: assign_to_site.
#
# Sourced:
#   settings.json → settings_data.project[] (via catc_common.load_settings):
#     device_list — comma-separated management IPs
#     HierarchyParent/Area/Bldg/Floor — composed into the target site path
#       (deepest non-empty level wins)
#   connection.yml: dnac_host, dnac_port, dnac_version, dnac_verify, dnac_debug
#   vault.yml: catc_username, catc_password
#   env DEBUG → catc_debug
#
# Produced:
#   site_device_map — { "Global/PODS/POD 0/Building P0/Floor 1":
#                        ["198.19.1.3", "198.19.1.4"] }
#   In Catalyst Center: each device associated with its site; site UUID is
#   resolved once per site rather than once per device.
#
# Depends on: stage 01 (hierarchy) and stage 04 (devices in inventory)
# Modules: cisco.dnac.site_info, cisco.dnac.assign_device_to_site
#
# Run: ansible-playbook playbooks/05_assign_to_site.yml
# =============================================================================
- name: Assign Devices to Site in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/catalyst_center/vault.yml
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.site_info:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
    cisco.dnac.assign_device_to_site:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: assign_to_site
