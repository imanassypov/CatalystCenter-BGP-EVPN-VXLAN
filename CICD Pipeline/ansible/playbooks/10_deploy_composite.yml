---
# =============================================================================
# 10_deploy_composite.yml  —  Pipeline stage 10
# =============================================================================
# Final stage: pushes the Day-N composite templates onto the target switches,
# rendering the BGP EVPN VXLAN fabric configuration. Role: deploy_composite
# (per-entry work in roles/deploy_composite/tasks/deploy_entry.yml — template
# version resolution, device UUID lookup, deploy + task polling).
#
# Sourced (pre_tasks, order matters):
#   catc_common tasks_from: auth_token    → _catc_token
#   catc_common tasks_from: load_settings → settings_data
#   settings.json → settings_data.project[].network_profile.DayNTemplateNames[]:
#     TemplateName    — e.g. "Building-P0-Composite"
#     Project         — e.g. "Building P0"
#     DeployTemplate  — only entries set true are queued
#     TemplateTarget  — ["198.19.1.3", "198.19.1.4"] management IPs to configure
#   connection.yml:
#     force_push_template (true)  — redeploy even when CatC reports no diff
#     member_template_params ({}) — extra params passed to member templates
#     task_poll_retries (60), task_poll_delay (10)
#     dnac_host/port/version/verify/debug
#   vault.yml: catc_username, catc_password
#
# Produced:
#   _deploy_entries — flattened deploy queue:
#     [{ site: "Global/PODS/POD 0/Building P0/Floor 1",
#        template_name: "Building-P0-Composite",
#        project_name: "Building P0",
#        template_target: ["198.19.1.3", "198.19.1.4"],
#        template_tag: "" }]
#   On devices: rendered IOS-XE fabric configuration (VRFs, loopbacks, NVE,
#   BGP EVPN, overlay SVIs, multicast, NAC).
#
# Depends on: stage 07 (templates exist) and stage 09 (devices provisioned)
# Module: cisco.dnac.configuration_template_deploy_v2
#
# Run: ansible-playbook playbooks/10_deploy_composite.yml
# =============================================================================
- name: Deploy Composite Templates to Managed Devices from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/catalyst_center/vault.yml
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.configuration_template_deploy_v2:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
  pre_tasks:
    - name: Obtain Catalyst Center auth token
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: auth_token

    - name: Load settings.json
      ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: deploy_composite
