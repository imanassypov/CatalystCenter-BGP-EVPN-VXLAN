---
# =============================================================================
# 00_bootstrap_script_server.yml  —  Pipeline stage 00 (jump host bootstrap)
# =============================================================================
# Closes the gap between what the dCloud image's `~/install-ansible.sh` leaves
# behind and what stages 01-11 actually need. The image script is baked into the
# pod and cannot be edited, so everything it misses is applied here instead.
#
# install-ansible.sh already provides:
#   ~/tecops-venv (Python 3.9), ansible-core 2.15, catalystcentersdk,
#   dnacentersdk, and the collections cisco.catalystcenter / cisco.dnac /
#   ansible.utils / community.general / cisco.ios / cisco.nxos.
#
# This playbook adds what it does not:
#   1. virl2_client <2.10  — cisco.cml 1.2.0 reads the node.config attribute
#      that 2.10 removed. Without the SDK the CML inventory plugin fails with
#      "name 'ClientLibrary' is not defined" and inventory/cml.yml is skipped.
#   2. collections/requirements-jumphost.yml — repins every collection to the
#      newest release that still admits ansible-core 2.15, silencing the
#      "does not support Ansible version 2.15.x" warnings.
#   3. The gitignored credential files that a fresh clone never has:
#      ../.vault_pass, ../.env, and a vault.yml for every group_vars directory
#      shipping a vault.yml.example. Each is created from its example (or
#      generated) ONLY when absent, newly created vaults are encrypted with
#      ansible-vault, then reported as needing real values. Existing files are
#      never overwritten or re-encrypted.
#
# Does NOT touch apt or /usr/bin/python3 — install-ansible.sh repoints those at
# 3.8 so apt_pkg keeps working, and fighting it breaks package management.
#
# Idempotent and safe to re-run.
#
# Run: ansible-playbook playbooks/00_bootstrap_script_server.yml
#      ansible-playbook playbooks/00_bootstrap_script_server.yml -e scaffold_secrets=false
# =============================================================================
- name: Bootstrap the dCloud script server for the BGP EVPN pipeline
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Create missing credential files from their examples. Set false to only
    # report what is missing without writing anything.
    scaffold_secrets: true

    _ansible_dir: "{{ playbook_dir | dirname }}"
    _pipeline_dir: "{{ playbook_dir | dirname | dirname }}"
    _vault_pass_file: "{{ _pipeline_dir }}/.vault_pass"
    _env_file: "{{ _pipeline_dir }}/.env"
    _env_example: "{{ _pipeline_dir }}/.env.example"
    _group_vars_dir: "{{ _ansible_dir }}/inventory/group_vars"
    _jumphost_requirements: "{{ _ansible_dir }}/collections/requirements-jumphost.yml"

  tasks:
    # ── Preflight ────────────────────────────────────────────────────────────
    # ansible_playbook_python is the interpreter running this play, i.e. the
    # venv's python when the venv is active. Installing through it guarantees
    # virl2_client lands where the inventory plugin will look for it.
    - name: "Preflight — record interpreter and ansible-core version"
      ansible.builtin.set_fact:
        _venv_python: "{{ ansible_playbook_python }}"
        _core_version: "{{ ansible_version.full }}"

    - name: "Preflight — fail if not running inside a virtualenv"
      ansible.builtin.assert:
        that:
          - "'venv' in _venv_python or 'virtualenv' in _venv_python"
        fail_msg: >-
          Ansible is running from {{ _venv_python }}, which is not a virtualenv.
          Run `source ~/tecops-venv/bin/activate` first, otherwise virl2_client
          installs outside the venv and the CML inventory plugin still fails.
        success_msg: "Using interpreter {{ _venv_python }} (ansible-core {{ _core_version }})"

    - name: "Preflight — verify the jump-host requirements file is present"
      ansible.builtin.stat:
        path: "{{ _jumphost_requirements }}"
      register: _req_stat

    - name: "Preflight — fail if the repo layout is unexpected"
      ansible.builtin.assert:
        that:
          - _req_stat.stat.exists
        fail_msg: >-
          {{ _jumphost_requirements }} not found. Run this playbook from
          `CICD Pipeline/ansible` inside a full clone of the repository.

    # ── 1. CML SDK ───────────────────────────────────────────────────────────
    # <2.10 is deliberate: 2.10 removed Node.config, which cisco.cml 1.2.0 still
    # reads. The resulting "'Node.config' is deprecated" notice is expected.
    - name: "Install virl2_client (pinned <2.10 for cisco.cml 1.2.0)"
      ansible.builtin.pip:
        name: "virl2_client>=2.0.0,<2.10.0"
        state: present
        executable: "{{ _venv_python | dirname }}/pip"
      register: _virl_install

    # Imports the exact symbol cisco.cml's inventory plugin needs — a bare
    # `import virl2_client` succeeds even when the SDK is unusable, and the
    # package exposes no __version__, so read it from the installed metadata.
    - name: "Verify the CML inventory plugin's import succeeds"
      ansible.builtin.command:
        argv:
          - "{{ _venv_python }}"
          - "-c"
          - "from virl2_client import ClientLibrary; from importlib.metadata import version; print(version('virl2_client'))"
      register: _virl_check
      changed_when: false

    # ── 2. Collections ───────────────────────────────────────────────────────
    # requirements-jumphost.yml, not requirements.yml: the venv is Python 3.9,
    # which caps ansible-core at 2.15, and the default file targets a 2.17
    # control node.
    - name: "Install the 2.15-compatible collection set"
      ansible.builtin.command:
        argv:
          - "{{ _venv_python | dirname }}/ansible-galaxy"
          - collection
          - install
          - "-r"
          - "{{ _jumphost_requirements }}"
          - "--force"
      register: _galaxy_install
      changed_when: "'was installed successfully' in _galaxy_install.stdout"

    # ── 3. Credential files ──────────────────────────────────────────────────
    # All are gitignored, so a fresh clone never has them. Create only when
    # absent — overwriting would invalidate an existing encrypted vault.
    - name: "Check for the credential files a fresh clone lacks"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ _vault_pass_file }}"
        - "{{ _env_file }}"
      register: _cred_stat

    - name: "Resolve which credential files are missing"
      ansible.builtin.set_fact:
        _missing: "{{ _cred_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    # A generated passphrase is sufficient because .vault_pass only has to match
    # whatever encrypted vault.yml on this host. seed= keeps it deterministic
    # per host so a re-run does not invalidate a vault encrypted by a prior run.
    - name: "Generate {{ _vault_pass_file | basename }} (absent only)"
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'], seed=inventory_hostname) }}"
        dest: "{{ _vault_pass_file }}"
        mode: "0600"
      when:
        - scaffold_secrets | bool
        - _vault_pass_file in _missing

    - name: "Seed {{ _env_file | basename }} from .env.example (absent only)"
      ansible.builtin.copy:
        src: "{{ _env_example }}"
        dest: "{{ _env_file }}"
        mode: "0600"
        remote_src: true
      when:
        - scaffold_secrets | bool
        - _env_file in _missing

    # ── 3b. group_vars vaults ────────────────────────────────────────────────
    # Discovered rather than hardcoded so a new group_vars directory is picked
    # up automatically the moment it ships a vault.yml.example.
    - name: "Discover every group_vars vault template"
      ansible.builtin.find:
        paths: "{{ _group_vars_dir }}"
        patterns: "vault.yml.example"
        recurse: true
      register: _vault_examples

    - name: "Resolve the vault.yml each template should produce"
      ansible.builtin.set_fact:
        _vault_targets: "{{ _vault_examples.files | map(attribute='path') | map('regex_replace', '\\.example$', '') | sort | list }}"

    - name: "Check which group_vars vaults already exist"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ _vault_targets }}"
      register: _vault_stat

    - name: "Resolve which group_vars vaults must be created"
      ansible.builtin.set_fact:
        _vaults_to_create: "{{ _vault_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    # A generated .vault_pass cannot decrypt a vault encrypted by someone else,
    # so refuse to continue rather than leaving an undecryptable pair behind.
    - name: "Refuse to proceed if .vault_pass was generated but vaults already exist"
      ansible.builtin.assert:
        that:
          - _vault_pass_file not in _missing or _vaults_to_create | length == _vault_targets | length
        fail_msg: >-
          {{ _vault_pass_file }} was missing and has just been generated, but
          an encrypted vault.yml already exists. The new passphrase cannot
          decrypt it. Restore the original .vault_pass, or delete the stale
          vault.yml files and re-run.

    - name: "Seed missing group_vars vaults from their examples"
      ansible.builtin.copy:
        src: "{{ item }}.example"
        dest: "{{ item }}"
        mode: "0600"
        remote_src: true
      loop: "{{ _vaults_to_create }}"
      when: scaffold_secrets | bool

    # Only the files seeded above — ansible-vault errors on already-encrypted
    # input, and re-encrypting someone else's vault would destroy their data.
    - name: "Encrypt the newly seeded vaults"
      ansible.builtin.command:
        argv:
          - "{{ _venv_python | dirname }}/ansible-vault"
          - encrypt
          - "--vault-password-file"
          - "{{ _vault_pass_file }}"
          - "{{ item }}"
      loop: "{{ _vaults_to_create }}"
      when: scaffold_secrets | bool
      changed_when: true

    # Reads only the 14-byte magic header, never the plaintext body.
    - name: "Check the encryption state of every group_vars vault"
      ansible.builtin.command:
        argv: ["head", "-c", "14", "{{ item }}"]
      loop: "{{ _vault_targets }}"
      register: _vault_hdr
      changed_when: false
      failed_when: false

    - name: "Resolve which vaults are still plaintext"
      ansible.builtin.set_fact:
        _vault_plaintext: "{{ _vault_hdr.results | selectattr('rc', 'equalto', 0) | rejectattr('stdout', 'equalto', '$ANSIBLE_VAULT') | map(attribute='item') | list }}"

    # ── 4. Report ────────────────────────────────────────────────────────────
    - name: "Bootstrap summary"
      ansible.builtin.debug:
        msg:
          - "interpreter      : {{ _venv_python }} (ansible-core {{ _core_version }})"
          - "virl2_client     : {{ _virl_check.stdout }}"
          - "collections      : installed from {{ _jumphost_requirements | basename }}"
          - "credential files : {{ 'all present' if _missing | length == 0 else (_missing | map('basename') | join(', ')) ~ ' were missing' }}"
          - "group_vars vaults: {{ _vault_targets | length }} found, {{ _vaults_to_create | length }} seeded and encrypted this run"
          - "{{ 'ACTION REQUIRED — these hold placeholder values. Edit with `ansible-vault edit <file>` before running stage 01:' if (_missing + _vaults_to_create) | length > 0 else 'No further action required.' }}"
          - "{{ (_missing + _vaults_to_create) | join(', ') }}"
          - "{{ 'WARNING — these vaults are NOT encrypted: ' ~ (_vault_plaintext | join(', ')) if _vault_plaintext | length > 0 else '' }}"

    - name: "Expected warnings that are NOT errors"
      ansible.builtin.debug:
        msg:
          - "Collection cisco.catalystcenter does not support Ansible version 2.15.x — held at 2.9.0 deliberately; 2.3.1 returns dnac_response instead of catalystcenter_response and breaks stage 01."
          - "'Node.config' is deprecated — virl2_client 2.9.x with cisco.cml 1.2.0, the pin is intentional."
          - "Found both group and host with same name: dhcp-server — a CML node label matching a CML tag."
