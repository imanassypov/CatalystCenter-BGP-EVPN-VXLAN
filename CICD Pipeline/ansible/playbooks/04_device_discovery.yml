---
# =============================================================================
# 04_device_discovery.yml  —  Pipeline stage 04
# =============================================================================
# Submits Catalyst Center discovery jobs for the management IPs declared in
# settings.json, adding reachable devices to the CatC inventory under Global.
# Role: device_discovery.
#
# Sourced:
#   settings.json → settings_data.project[] (via catc_common.load_settings):
#     device_list — comma-separated management IPs, e.g. "198.19.1.3,198.19.1.4"
#     HierarchyParent/Area/Bldg/Floor — composed into the discovery job name
#   connection.yml:
#     dnac_host, dnac_port, dnac_version, dnac_verify, dnac_debug,
#     dnac_log, dnac_log_level
#     discovery_cli_credentials, discovery_snmp_read_credentials,
#     discovery_snmp_write_credentials, discovery_netconf_credentials
#       — credential *descriptions* only (CLI-net-admin, RO, RW,
#         NETCONF-netadmin); passwords stay in CatC from stage 03
#   vault.yml: catc_username, catc_password
#   env DEBUG → catc_debug
#
# Produced:
#   discovery_list — one job per project row with a non-empty device_list:
#     [{ discovery_name: "<site path>",
#        discovery_type: "MULTI RANGE",
#        ip_address_list: ["198.19.1.3", "198.19.1.4"],
#        protocol_order: "ssh",
#        global_credentials: { cli_credentials_list[],
#                              snmp_v2_read_credential_list[],
#                              snmp_v2_write_credential_list[],
#                              net_conf_port_list[] } }]
#   In Catalyst Center: devices in inventory under Global, awaiting the site
#   assignment performed by stage 05.
#
# Depends on: stage 03 (global credentials must exist by description)
# Module: cisco.dnac.discovery_workflow_manager (state: merged)
#
# Run: ansible-playbook playbooks/04_device_discovery.yml
#      DEBUG=true ansible-playbook playbooks/04_device_discovery.yml
# =============================================================================
- name: Discover Devices in Catalyst Center from settings.json
  hosts: catalyst_center
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/catalyst_center/vault.yml
  vars:
    catc_debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"
  module_defaults:
    cisco.dnac.discovery_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ catc_username }}"
      dnac_password: "{{ catc_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
  pre_tasks:
    - ansible.builtin.import_role:
        name: catc_common
        tasks_from: load_settings
  roles:
    - role: device_discovery
